name: Catalog

on:
  schedule:
    - cron: "30 21 * * *" # 05:30 in Malaysia, after Japan's overnight updates
  workflow_dispatch:
    inputs:
      image_limit:
        description: "Most new images to make this run (each takes a download and two encodes)"
        default: "2500"
  pull_request:
    paths: ["catalog/**", ".github/workflows/catalog.yml"]

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: catalog/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: catalog
    env:
      # Images are made and uploaded only once R2 is configured (see catalog/README.md).
      R2_READY: ${{ vars.R2_BUCKET != '' && vars.R2_ENDPOINT != '' && vars.IMAGE_BASE_URL != '' }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # Recent AWS CLI versions add checksums R2 doesn't need; send them only when required.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: catalog/requirements.txt
      - run: pip install -r requirements.txt

      # Page and image cache: lets unchanged pages come back as 304s.
      - uses: actions/cache@v4
        with:
          path: catalog/.cache
          key: catalog-http-${{ github.run_id }}
          restore-keys: catalog-http-

      # The index in R2 lists every image already uploaded, so only new ones are made.
      - name: Fetch image index from R2
        if: env.R2_READY == 'true'
        run: |
          mkdir -p out
          aws s3api head-bucket --bucket "$R2_BUCKET" --endpoint-url "$R2_ENDPOINT"
          if aws s3api head-object --bucket "$R2_BUCKET" --key asset-index.json --endpoint-url "$R2_ENDPOINT" > /dev/null 2>&1; then
            aws s3 cp "s3://$R2_BUCKET/asset-index.json" out/asset-index.json --endpoint-url "$R2_ENDPOINT"
          else
            echo "No image index in R2 yet; starting a new one."
          fi

      - name: Build catalog
        env:
          IMAGE_BASE_URL: ${{ env.R2_READY == 'true' && vars.IMAGE_BASE_URL || '' }}
        run: |
          if [ "$R2_READY" = "true" ]; then
            python -m optcg_catalog.build --out out --cache .cache --images all --published-index \
              --image-limit "${{ inputs.image_limit || '2500' }}"
          else
            python -m optcg_catalog.build --out out --cache .cache --images none
          fi

      # Images go up before the index that lists them, and both before the catalog
      # that points at them, so the app never sees a file name that isn't there yet.
      - name: Upload new images and the index to R2
        if: env.R2_READY == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          if [ -d out/images ] && [ -n "$(ls -A out/images)" ]; then
            echo "Uploading $(ls out/images | wc -l) files"
            aws s3 cp out/images "s3://$R2_BUCKET/img/" --recursive --only-show-errors --endpoint-url "$R2_ENDPOINT" \
              --content-type image/webp --cache-control "public, max-age=31536000, immutable"
          fi
          aws s3 cp out/asset-index.json "s3://$R2_BUCKET/asset-index.json" --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json

      - name: Summary
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open("out/report.json"))
          print(f"### Catalog {report['version']}")
          print("| | count |\n|---|---|")
          for name, count in report["counts"].items():
              print(f"| {name} | {count} |")
          print("\n**Checks**\n")
          for name, value in report["checks"].items():
              print(f"- `{name}`: {value['count']}")
          if report["errors"]:
              print("\n**Errors**\n")
              for error in report["errors"]:
                  print(f"- {error}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: catalog-${{ github.run_number }}
          path: |
            catalog/out/catalog.json
            catalog/out/report.json
            catalog/out/asset-index.json
          retention-days: 30

      # The app checks version.txt daily and downloads catalog.json.gz when it changes.
      # The catalog is uploaded before the version so the app never sees a version
      # whose catalog isn't there yet.
      - name: Publish catalog for the app
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gzip -9 -n -c out/catalog.json > out/catalog.json.gz
          python -c "import json; print(json.load(open('out/report.json'))['version'])" > out/version.txt
          if ! gh release view catalog > /dev/null 2>&1; then
            gh release create catalog --title "Card catalog" --latest=false \
              --notes "Latest card catalog for the app, updated daily by the Catalog workflow."
          fi
          gh release upload catalog out/catalog.json.gz --clobber
          gh release upload catalog out/version.txt --clobber

      # Don ids must never change, so new registry entries are committed back.
      - name: Commit don registry
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          if git diff --quiet -- data/don_registry.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/don_registry.json
          git commit -m "chore(catalog): update don registry"
          git push
