name: Catalog

on:
  schedule:
    - cron: "30 21 * * *" # 05:30 in Malaysia, after Japan's overnight updates
  workflow_dispatch:
    inputs:
      images:
        description: "Image mode: none (until image hosting is set up) or all"
        default: none
        type: choice
        options: [none, all]
  pull_request:
    paths: ["catalog/**", ".github/workflows/catalog.yml"]

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: catalog/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: catalog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: catalog/requirements.txt
      - run: pip install -r requirements.txt

      # Page and image cache: lets unchanged pages come back as 304s.
      - uses: actions/cache@v4
        with:
          path: catalog/.cache
          key: catalog-http-${{ github.run_id }}
          restore-keys: catalog-http-

      - name: Build catalog
        run: python -m optcg_catalog.build --out out --cache .cache --images "${{ inputs.images || 'none' }}"

      - name: Summary
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open("out/report.json"))
          print(f"### Catalog {report['version']}")
          print("| | count |\n|---|---|")
          for name, count in report["counts"].items():
              print(f"| {name} | {count} |")
          print("\n**Checks**\n")
          for name, value in report["checks"].items():
              print(f"- `{name}`: {value['count']}")
          if report["errors"]:
              print("\n**Errors**\n")
              for error in report["errors"]:
                  print(f"- {error}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: catalog-${{ github.run_number }}
          path: |
            catalog/out/catalog.json
            catalog/out/report.json
            catalog/out/asset-index.json
          retention-days: 30

      # Don ids must never change, so new registry entries are committed back.
      - name: Commit don registry
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          if git diff --quiet -- data/don_registry.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/don_registry.json
          git commit -m "chore(catalog): update don registry"
          git push
